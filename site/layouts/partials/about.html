{{/* About — portrait + story copy + CTA. */ -}}
<section id="about" class="bg-about-blue">
  <div class="max-w-7xl mx-auto section-pad">
    <div class="flex flex-col md:flex-row justify-between items-end mb-8 gap-4 relative -translate-y-[5px]">
      <div class="section-title-pipe">
        <span class="pipe text-brand-red">|</span>
        <span class="title-text">{{ .Param "about_label" }}</span>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
      <div class="relative -translate-y-[10px]">
        {{ with .Param "about_image" }}<img src="{{ . }}" class="block w-full max-w-sm mx-auto aspect-square rounded-full object-cover object-[50%_25%] grayscale hover:grayscale-0 transition-all duration-700" alt="{{ $.Param "hero_name" }}">{{ end }}
      </div>

      <div class="space-y-4 relative -translate-y-[25px]">
        <span class="pill-tag inline-block">{{ .Param "about_tag" }}</span>
        <h2 class="text-3xl md:text-4xl font-serif leading-tight text-charcoal">{{ .Param "about_heading" }} <br/><span class="italic text-brand-pink">{{ .Param "about_heading_accent" }}</span></h2>
        <p class="text-lg leading-snug text-charcoal/80 max-w-lg">{{ .Param "about_p1" }}</p>
        <p class="text-base leading-snug text-charcoal/70 max-w-lg">{{ .Param "about_p2" }}</p>
      </div>
    </div>
  </div>
</section>
