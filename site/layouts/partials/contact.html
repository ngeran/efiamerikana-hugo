{{/* Contact — big CTA + email + social links (from _index params). */ -}}
<section id="contact" class="bg-brand-red text-white text-center">
  <div class="max-w-3xl mx-auto space-y-12 section-pad">
    <h2 class="text-6xl md:text-8xl font-serif italic leading-none">{{ .Param "contact_heading" }}</h2>
    <div class="space-y-6">
      <p class="text-xl md:text-2xl font-medium text-white/80">{{ .Param "contact_text" }}</p>
      <a href="mailto:{{ .Param "contact_email" }}" class="text-xl md:text-4xl font-serif font-bold border-b-2 border-brand-yellow inline-block hover:text-brand-yellow transition-colors whitespace-nowrap">{{ .Param "contact_email" }}</a>
    </div>
    <div class="pt-12 flex flex-wrap justify-center items-center gap-6 sm:gap-8">
      {{ range .Param "socials" }}
      <a href="{{ .url | default "#" }}" class="flex items-center gap-2 text-white hover:text-brand-yellow transition-colors">
        {{ partial "social-icon.html" (dict "label" .label) }}
        <span class="text-sm font-bold uppercase tracking-widest">{{ .label }}</span>
      </a>
      {{ end }}
    </div>
  </div>
</section>
