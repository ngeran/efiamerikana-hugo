<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ .Param "description" }}" />
  <title>{{ with .Param "head_title" }}{{ . }}{{ else }}{{ .Site.Title }}{{ end }}</title>

  <!-- Google Fonts: Libre Caslon (headings) + Work Sans (body & wordmark), + Material Symbols. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

  <!-- Pre-compiled Tailwind v4 output, served verbatim (no Hugo Pipes). -->
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}" />
</head>
<body class="bg-brand-yellow text-charcoal font-sans selection:bg-brand-pink selection:text-white">
  {{ partial "header.html" . }}
  <main class="pt-16">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
