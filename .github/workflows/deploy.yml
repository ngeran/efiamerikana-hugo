name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allows manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4
        with:
          extra-conf: |
            accept-flake-config = true
            
      - name: Build Hugo site with Nix
        run: |
          nix build .#site
          # This creates ./result with the built site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploys the Nix-built site (./result) to the Pages project.
          # The project must already exist in Cloudflare (wrangler does not create it).
          command: pages deploy ./result --project-name=efiamerikana-site --branch main
